[project]
name = "dinkster-nodes-training"
version = "0.0.1"
description = "Dinkster training node pack: graph adapters over the host training service"
requires-python = ">=3.12"
dependencies = ["dinkster-api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_nodes_training"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_nodes_training_pack/dinkster-pack.toml"
"src/dinkster_nodes_training" = "dinkster_nodes_training_pack/dinkster_nodes_training"

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "45e7fd13afd94ae40d4283a0b45764b24c1fcd94", subdirectory = "packages/dinkster-api" }
