[project]
name = "dinkster-training-worker"
version = "0.0.1"
description = "Isolated executor for Dinkster training nodes"
requires-python = ">=3.12"
dependencies = ["dinkster-api", "dinkster-nodes-training", "dinkster-server", "dinkster-workers"]

# The default fake backend stays torch-free. Install this extra only in a
# dedicated training worker environment.
[project.optional-dependencies]
sd15-lora = ["dinkster-training-torch[torch]"]
sdxl-lora = ["dinkster-training-torch[torch]"]
flux-lora = ["dinkster-training-torch[torch]"]
ideogram4-lora = ["dinkster-training-torch[torch]"]
minimax-h3-lora = ["dinkster-training-torch[torch]"]
minimax-music3-lora = ["dinkster-training-torch[torch]"]
qwen-image-lora = ["dinkster-training-torch[torch]"]
wan-lora = ["dinkster-training-torch[torch]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_worker"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_training_worker_pack/dinkster-pack.toml"
"src/dinkster_training_worker" = "dinkster_training_worker_pack/dinkster_training_worker"

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "f75e22e8aa31975b400362ddea3cf249c5f5f4c1", subdirectory = "packages/dinkster-api" }
dinkster-nodes-training = { workspace = true }
dinkster-server = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "f75e22e8aa31975b400362ddea3cf249c5f5f4c1", subdirectory = "packages/dinkster-server" }
dinkster-training-torch = { workspace = true }
dinkster-workers = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "f75e22e8aa31975b400362ddea3cf249c5f5f4c1", subdirectory = "packages/dinkster-workers" }
