[project]
name = "dinkster-training-worker"
version = "0.0.1"
description = "Isolated executor for Dinkster training nodes"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-memory",
    "dinkster-nodes-training",
    "dinkster-server",
    "dinkster-workers",
]

# The default fake backend stays torch-free. Install this extra only in a
# dedicated training worker environment.
[project.optional-dependencies]
sd15-lora = ["dinkster-training-torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_worker"]

[tool.hatch.build.targets.wheel.force-include]
"dinkster-pack.toml" = "dinkster_training_worker_pack/dinkster-pack.toml"
"src/dinkster_training_worker" = "dinkster_training_worker_pack/dinkster_training_worker"

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "e4f5ae28f01c6009ff3cdc29503f8d0f990151ba", subdirectory = "packages/dinkster-api" }
dinkster-memory = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "e4f5ae28f01c6009ff3cdc29503f8d0f990151ba", subdirectory = "packages/dinkster-memory" }
dinkster-nodes-training = { workspace = true }
dinkster-server = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "e4f5ae28f01c6009ff3cdc29503f8d0f990151ba", subdirectory = "packages/dinkster-server" }
dinkster-training-torch = { workspace = true }
dinkster-workers = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "e4f5ae28f01c6009ff3cdc29503f8d0f990151ba", subdirectory = "packages/dinkster-workers" }
