[project]
name = "dinkster-training-torch"
version = "0.0.1"
description = "SD1.5 LoRA training through dinkster-comfy"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-comfy",
    "dinkster-nodes-training",
    "dinkster-server",
    "pillow>=10",
    "safetensors>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_torch"]

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "006de810bd764642d4b0c122e4a9afa9977fba4b", subdirectory = "packages/dinkster-api" }
dinkster-comfy = { git = "https://github.com/Kosinkadink/dinkster-comfy.git", rev = "6deaf543b990e9101ea8be59b376c45901602912" }
dinkster-nodes-training = { workspace = true }
dinkster-server = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "006de810bd764642d4b0c122e4a9afa9977fba4b", subdirectory = "packages/dinkster-server" }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
