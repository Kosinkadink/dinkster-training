[project]
name = "dinkster-training-torch"
version = "0.0.1"
description = "SD1.5 LoRA training through dinkster-inference"
requires-python = ">=3.12"
dependencies = [
    "comfy-kitchen==0.2.37",
    "dinkster-api",
    "dinkster-inference",
    "dinkster-nodes-training",
    "dinkster-server",
    "gguf>=0.13",
    "pillow>=10",
    "protobuf>=4.25",
    "safetensors>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_torch"]

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "1a681440c71e3eee7231471c3fead748c4c60d64", subdirectory = "packages/dinkster-api" }
dinkster-inference = { git = "https://github.com/Kosinkadink/dinkster-inference.git", rev = "96bdbeabe3c0011934d2f502955758c8f471aa55" }
dinkster-nodes-training = { workspace = true }
dinkster-server = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "1a681440c71e3eee7231471c3fead748c4c60d64", subdirectory = "packages/dinkster-server" }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
