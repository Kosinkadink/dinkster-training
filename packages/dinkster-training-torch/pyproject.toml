[project]
name = "dinkster-training-torch"
version = "0.0.1"
description = "SD1.5 LoRA training through dinkster-inference"
requires-python = ">=3.12"
dependencies = [
    "dinkster-api",
    "dinkster-inference",
    "dinkster-nodes-training",
    "dinkster-server",
    "pillow>=10",
    "safetensors>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_training_torch"]

[tool.uv.sources]
dinkster-api = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "a91b1e1568fbd05f6431f023f0a25262f9167290", subdirectory = "packages/dinkster-api" }
dinkster-inference = { git = "https://github.com/Kosinkadink/dinkster-inference.git", rev = "8eeb24bd5ef1e217929b699bd5f6b2d6b1b774f7" }
dinkster-nodes-training = { workspace = true }
dinkster-server = { git = "https://github.com/Kosinkadink/Dinkster.git", rev = "a91b1e1568fbd05f6431f023f0a25262f9167290", subdirectory = "packages/dinkster-server" }

[tool.pyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
