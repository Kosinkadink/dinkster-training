name: full-validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pyright -p packages/dinkster-training-torch
      - run: uv run pytest -q tests

  training-core:
    name: training runtime - core
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest -q
          packages/dinkster-training-torch/tests/test_distributed.py
          packages/dinkster-training-torch/tests/test_multi_rank_service.py
          packages/dinkster-training-torch/tests/test_rank_rng_checkpoint.py
          packages/dinkster-training-torch/tests/test_rank_strided_training.py
          packages/dinkster-training-torch/tests/test_trainer_seams.py

  training-sd15-1:
    name: training runtime - Stable Diffusion 1.5 (shard 1)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest --collect-only -q packages/dinkster-training-torch/tests/test_sd15_lora.py
          | grep '^packages/dinkster-training-torch/tests/test_sd15_lora.py::'
          | awk 'NR % 3 == 1'
          | xargs -d '\n' uv run pytest -q

  training-sd15-2:
    name: training runtime - Stable Diffusion 1.5 (shard 2)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest --collect-only -q packages/dinkster-training-torch/tests/test_sd15_lora.py
          | grep '^packages/dinkster-training-torch/tests/test_sd15_lora.py::'
          | awk 'NR % 3 == 2'
          | xargs -d '\n' uv run pytest -q

  training-sd15-3:
    name: training runtime - Stable Diffusion 1.5 (shard 3)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest --collect-only -q packages/dinkster-training-torch/tests/test_sd15_lora.py
          | grep '^packages/dinkster-training-torch/tests/test_sd15_lora.py::'
          | awk 'NR % 3 == 0'
          | xargs -d '\n' uv run pytest -q

  training-sdxl:
    name: training runtime - SDXL
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run pytest -q packages/dinkster-training-torch/tests/test_sdxl_lora.py

  training-image:
    name: training runtime - image models
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest -q
          packages/dinkster-training-torch/tests/test_flux_dataset.py
          packages/dinkster-training-torch/tests/test_flux_lora.py
          packages/dinkster-training-torch/tests/test_flux2_dataset.py
          packages/dinkster-training-torch/tests/test_flux2_lora.py
          packages/dinkster-training-torch/tests/test_ideogram4_dataset.py
          packages/dinkster-training-torch/tests/test_ideogram4_lora.py
          packages/dinkster-training-torch/tests/test_qwen_image_dataset.py
          packages/dinkster-training-torch/tests/test_qwen_image_lora.py

  training-media:
    name: training runtime - media models
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - run: >-
          uv run pytest -q
          packages/dinkster-training-torch/tests/test_minimax_h3_dataset.py
          packages/dinkster-training-torch/tests/test_minimax_h3_lora.py
          packages/dinkster-training-torch/tests/test_minimax_music3_dataset.py
          packages/dinkster-training-torch/tests/test_minimax_music3_lora.py
          packages/dinkster-training-torch/tests/test_minimax_music3_training_gpu.py
          packages/dinkster-training-torch/tests/test_wan_dataset.py
          packages/dinkster-training-torch/tests/test_wan_lora.py

  main-status:
    name: main validation status
    if: always()
    needs:
      [quality, training-core, training-sd15-1, training-sd15-2, training-sd15-3, training-sdxl, training-image, training-media]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record every lane result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TRAINING_CORE_RESULT: ${{ needs.training-core.result }}
          TRAINING_SD15_1_RESULT: ${{ needs.training-sd15-1.result }}
          TRAINING_SD15_2_RESULT: ${{ needs.training-sd15-2.result }}
          TRAINING_SD15_3_RESULT: ${{ needs.training-sd15-3.result }}
          TRAINING_SDXL_RESULT: ${{ needs.training-sdxl.result }}
          TRAINING_IMAGE_RESULT: ${{ needs.training-image.result }}
          TRAINING_MEDIA_RESULT: ${{ needs.training-media.result }}
        run: |
          printf '{"commit":"%s","lanes":{"quality":"%s","training-core":"%s","training-sd15-1":"%s","training-sd15-2":"%s","training-sd15-3":"%s","training-sdxl":"%s","training-image":"%s","training-media":"%s"}}\n' \
            "$GITHUB_SHA" "$QUALITY_RESULT" "$TRAINING_CORE_RESULT" \
            "$TRAINING_SD15_1_RESULT" "$TRAINING_SD15_2_RESULT" \
            "$TRAINING_SD15_3_RESULT" \
            "$TRAINING_SDXL_RESULT" \
            "$TRAINING_IMAGE_RESULT" "$TRAINING_MEDIA_RESULT" > main-validation-status.json
          cat main-validation-status.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: main-validation-status
          path: main-validation-status.json
          retention-days: 30
          if-no-files-found: error
      - name: Require every lane to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TRAINING_CORE_RESULT: ${{ needs.training-core.result }}
          TRAINING_SD15_1_RESULT: ${{ needs.training-sd15-1.result }}
          TRAINING_SD15_2_RESULT: ${{ needs.training-sd15-2.result }}
          TRAINING_SD15_3_RESULT: ${{ needs.training-sd15-3.result }}
          TRAINING_SDXL_RESULT: ${{ needs.training-sdxl.result }}
          TRAINING_IMAGE_RESULT: ${{ needs.training-image.result }}
          TRAINING_MEDIA_RESULT: ${{ needs.training-media.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TRAINING_CORE_RESULT" = success
          test "$TRAINING_SD15_1_RESULT" = success
          test "$TRAINING_SD15_2_RESULT" = success
          test "$TRAINING_SD15_3_RESULT" = success
          test "$TRAINING_SDXL_RESULT" = success
          test "$TRAINING_IMAGE_RESULT" = success
          test "$TRAINING_MEDIA_RESULT" = success
