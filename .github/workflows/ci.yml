name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: format, lint, types and integration tests
    runs-on: ${{ fromJSON(vars.CI_RUNNERS)[github.event.pull_request.head.repo.full_name != github.repository && 'forkLinux' || 'linux'] }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Require private dependency access
        env:
          DINKSTER_READ_KEY: ${{ secrets.DINKSTER_READ_KEY }}
        run: |
          if [ -z "$DINKSTER_READ_KEY" ]; then
            echo "Required private inputs were unavailable; pull request validation did not run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - uses: ./.github/actions/configure-dinkster-access
        with:
          deploy-key: ${{ secrets.DINKSTER_READ_KEY }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pyright -p packages/dinkster-training-torch
      - run: uv run pytest -q tests
